[workspace]
members = ["proto", "config", "bgp", "rib", "cli", "watchdog"]
resolver = "2"

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
tracing     = "0.1"
thiserror   = "1"
bytes       = "1"
garde       = { version = "0.22", features = ["derive", "full"] }
ipnet       = { version = "2", features = ["serde"] }
postcard    = { version = "1", features = ["alloc"] }
tokio-util  = { version = "0.7", features = ["codec"] }
futures     = "0.3"
nos-proto          = { path = "proto" }
clap               = { version = "4", features = ["derive"] }
anyhow             = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reedline            = "0.51.0"
nix                 = { version = "0.29", default-features = false, features = ["signal", "process"] }

# test dependencies
tempfile    = "3"
proptest    = "1"
insta       = "1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
pedantic              = { level = "warn", priority = -1 }
# allow noisy pedantic lints that produce more churn than value at this stage
must_use_candidate        = "allow"
module_name_repetitions   = "allow"
missing_errors_doc        = "allow"
missing_panics_doc        = "allow"
# flat one-arm-per-command/topic tables (Command::parse, resolve_in_transaction,
# command_doc) are meant to read as a table, not be split up to dodge a line count
too_many_lines             = "allow"
