[package]
name    = "nos-rest"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nos-pki            = { workspace = true }
tokio              = { workspace = true, features = ["signal"] }
tracing            = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
nos-proto          = { workspace = true, features = ["openapi"] }
nos-daemon         = { workspace = true }
tokio-util         = { workspace = true }
futures            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
socket2            = { workspace = true }
axum               = { workspace = true }
percent-encoding   = { workspace = true }
utoipa             = { workspace = true }
utoipa-axum        = { workspace = true }
utoipa-swagger-ui  = { workspace = true }
base64             = { workspace = true }
bytes              = { workspace = true }
hyper              = { version = "1", features = ["server", "http1", "http2"] }
hyper-util         = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "http1", "http2", "service"] }
tower              = { version = "0.5", features = ["util"] }

# Returns freed pages to the OS; glibc malloc fragments under REST churn (#801).
tikv-jemallocator = "0.6"
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]

[[bin]]
name = "nos-restd"
path = "src/main.rs"

[dev-dependencies]
tokio-rustls = { workspace = true }
tokio        = { workspace = true, features = ["test-util"] }
hyper        = { version = "1", features = ["client"] }
nos-pki  = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
nos-config = { path = "../config", version = "0.1.0" }
