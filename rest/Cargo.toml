[package]
name    = "nos-rest"
publish = false
version = "0.1.0"
edition = "2021"
license.workspace = true

[lints]
workspace = true

[dependencies]
nos-pki            = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
tracing-subscriber = { workspace = true }
nos-proto          = { workspace = true, features = ["openapi"] }
nos-log-client     = { workspace = true }
tokio-util         = { workspace = true }
futures            = { workspace = true }
thiserror          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
socket2            = { workspace = true }
axum               = { workspace = true }
percent-encoding   = { workspace = true }
utoipa             = { workspace = true }
utoipa-axum        = { workspace = true }
utoipa-swagger-ui  = { workspace = true }
base64             = { workspace = true }
bytes              = { workspace = true }
hyper              = { version = "1", features = ["server", "http1", "http2"] }
hyper-util         = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "http1", "http2", "service"] }
tower              = { version = "0.5", features = ["util"] }

[[bin]]
name = "nos-restd"
path = "src/main.rs"

[dev-dependencies]
tokio-rustls = { workspace = true }
hyper        = { version = "1", features = ["client"] }
nos-pki  = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
nos-config = { path = "../config", version = "0.1.0" }
