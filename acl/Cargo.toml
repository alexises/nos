[package]
name    = "nos-acl"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nos-pki     = { workspace = true }
nos-daemon  = { workspace = true }
nos-proto   = { workspace = true }
nos-tc      = { workspace = true }
tokio       = { workspace = true, features = ["signal"] }
tokio-util  = { workspace = true }
futures     = { workspace = true }
tracing     = { workspace = true }
clap        = { workspace = true }
anyhow      = { workspace = true }

[dev-dependencies]
nos-pki  = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
ipnet    = { workspace = true }
proptest = { workspace = true }

[[bin]]
name = "nos-acld"
path = "src/main.rs"
