[graph]
targets = []

[advisories]
version = 2
# atomic-polyfill: unmaintained, reached only via postcard 1 -> heapless 0.7; no postcard release drops it.
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "transitive via postcard 1 -> heapless 0.7; nothing NOS controls" },
]
unmaintained = "all"

[licenses]
version = 2
# The nos-* crates are never published (`publish = false`) and carry no license field.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
