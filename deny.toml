[graph]
targets = []

[advisories]
version = 2
ignore = []
# Transitive unmaintained crates (atomic-polyfill, paste) are only a warning: nothing
# here depends on them directly, so nothing here can fix them.
unmaintained = "workspace"

[licenses]
version = 2
# The nos-* crates are never published (`publish = false`) and carry no license field.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
