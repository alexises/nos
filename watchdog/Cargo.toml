[package]
name    = "nos-watchdog"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
nix                = { workspace = true }
nos-proto          = { workspace = true }
nos-log-client     = { workspace = true }
futures            = { workspace = true }
tokio-util         = { workspace = true }
nos-pki            = { workspace = true }
nos-password       = { workspace = true }

[[bin]]
name = "nos-watchdogd"
path = "src/main.rs"

[dev-dependencies]
nos-pki  = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
tempfile = { workspace = true }
