x-nos-image: &nos-image
  build:
    context: .
    dockerfile: Dockerfile
  image: nos:local

services:
  watchdog:
    <<: *nos-image
    container_name: nos-watchdog
    volumes:
      - nos-run:/run/nos
      - nos-data:/var/lib/nos

  cli:
    <<: *nos-image
    entrypoint: ["nos"]
    depends_on:
      - watchdog
    volumes:
      - nos-run:/run/nos
    stdin_open: true
    tty: true

volumes:
  nos-run:
  nos-data:
