x-nos-image: &nos-image
  build:
    context: .
    dockerfile: Dockerfile
  image: nos:local

services:
  watchdog:
    <<: *nos-image
    container_name: nos-watchdog
    # nos-ribd/nos-interfaced's Linux drivers program the kernel (VRF
    # devices, addresses, routes) via rtnetlink; NET_ADMIN/NET_RAW here
    # widen the container's capability bounding set so the setcap file
    # capabilities baked into those two binaries (see Dockerfile) are
    # actually usable by the non-root `nos` user watchdog execs them as.
    # nos-bgpd needs NET_RAW (SO_BINDTODEVICE, to scope its TCP sockets into
    # a VRF) and NET_BIND_SERVICE (to listen on BGP's well-known port 179).
    # nos-ospfd needs NET_RAW too, for its own VRF-scoped raw protocol-89
    # socket. nos-ospfv3d needs NET_RAW for the same reason, over a raw
    # IPv6 protocol-89 socket instead. nos-lacpd also needs NET_RAW, for its
    # own raw AF_PACKET slow-protocols socket per member port (real LACPDU
    # exchange), and nos-lldpd for its own raw AF_PACKET socket per
    # LLDP-enabled interface, nos-stpd for its raw AF_PACKET BPDU socket per
    # STP port, nos-bfdd for SO_BINDTODEVICE into each BFD
    # table's VRF (and UDP 3784 via NET_BIND_SERVICE), and nos-restd for SO_BINDTODEVICE into its
    # routing table's VRF. Both NET_RAW/NET_BIND_SERVICE are already in Docker's default
    # capability set, so this is belt-and-suspenders — listed explicitly,
    # like NET_ADMIN above, so the container's actual capability
    # requirements aren't silently implicit.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    # The watchdog gives each child up to 10s after SIGINT; nos-ospfd's RFC
    # 6987 on-shutdown hold plus its LSA flush takes up to 9s of that. Docker's
    # own 10s default would SIGKILL the whole container first.
    stop_grace_period: 15s
    # Read-only rootfs: writes go to the volumes below (/run/nos, /var/lib/nos)
    # and /tmp (tmpfs, 1777). Mirrored in tools/e2e/src/docker.rs.
    read_only: true
    tmpfs:
      - /tmp
    # Do NOT set `security_opt: [no-new-privileges:true]`: the kernel then
    # ignores file capabilities on exec, so every setcap binary (ribd,
    # interfaced, bgpd, ...) loses its capabilities, nos-watchdogd's
    # cap_setuid/cap_setgid included. `kernel.yama.ptrace_scope=2` is a host
    # sysctl (not settable here); see docs/architecture/ipc-security.md.
    volumes:
      - nos-run:/run/nos
      - nos-data:/var/lib/nos

  cli:
    <<: *nos-image
    entrypoint: ["nos"]
    # The image defaults to `nos-wd` (the watchdog's uid); the shell is a
    # `nos` client of the 0660 sockets.
    user: nos
    depends_on:
      - watchdog
    volumes:
      - nos-run:/run/nos
    # `nos`'s `edit source` writes its tempfile under /tmp.
    read_only: true
    tmpfs:
      - /tmp
    stdin_open: true
    tty: true

volumes:
  nos-run:
  nos-data:
