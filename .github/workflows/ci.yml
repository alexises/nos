name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
  # `mutants` and the two canaries: the canaries float (newest stable / nightly), so
  # the cron finds drift within a day without anyone pushing. Every other job skips it.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The toolchain fmt/clippy/test/coverage run on. Bump it on purpose (see CLAUDE.md
  # "Rust toolchain"); `clippy-canary` warns when the newest stable would break.
  # Every job runs the Makefile target, so a local `make <target>` is the same command
  # on the same toolchain (natively, or in the nos-ci image on a host without it).
  RUST_TOOLCHAIN: "1.99.0"
  # The dated nightly Miri runs on (`make miri`); `miri-canary` tries the newest one.
  MIRI_TOOLCHAIN: "nightly-2026-10-03"

jobs:
  claude-md:
    name: CLAUDE.md size
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - run: make claude-md-size

  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: make fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: make clippy

  clippy-canary:
    name: Clippy (stable canary)
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.canary.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Step-level continue-on-error keeps the check green: a job-level one still
      # shows a red X on the commit/PR.
      - id: canary
        continue-on-error: true
        # `+stable`: rust-toolchain.toml would otherwise pin it back to RUST_TOOLCHAIN.
        run: cargo +stable clippy --workspace --all-targets
      - if: steps.canary.outcome == 'failure'
        run: echo "::warning::The newest stable rustc breaks clippy -D warnings; bump RUST_TOOLCHAIN in ci.yml (see CLAUDE.md \"Rust toolchain\")."

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: make test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: make coverage
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Text output, so findings print in the log like `make sast`. No SARIF upload:
      # code scanning is off on this private repo, so it could never succeed.
      - run: semgrep scan --config p/rust --exclude target --error --metrics=off .

  miri:
    name: Miri (UB check)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      # The pinned stable too: `make` checks rustc against it to stay native.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MIRI_TOOLCHAIN }}
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # Only the pure-logic leaf crates: Miri cannot execute FFI, and everything else in
      # the workspace either is FFI (`nos-tcp-auth`/`nos-l2-socket` — raw setsockopt and
      # AF_PACKET), runs TLS through aws-lc-rs's C code in its tests (`nos-pki` and every
      # daemon/client), or is argon2 (`nos-password`), hours long under an interpreter.
      # RUSTFLAGS/MIRIFLAGS are set by the Makefile target.
      - run: make miri

  miri-canary:
    name: Miri (nightly canary)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      outcome: ${{ steps.canary.outcome }}
    env:
      RUSTFLAGS: "-D warnings -A deprecated"
      MIRIFLAGS: "-Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - id: canary
        continue-on-error: true
        run: cargo +nightly miri test -p nos-rpl -p nos-ospf-common -p nos-proto
      - if: steps.canary.outcome == 'failure'
        run: echo "::warning::The newest nightly breaks Miri; bump MIRI_TOOLCHAIN in ci.yml once a fixed one exists (see CLAUDE.md \"Rust toolchain\")."

  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Run nightly or on manual dispatch only — too slow for every PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      - run: cargo mutants --workspace

  # A red master (or canary) opens one `ci-red` issue, or comments on the open one, the
  # same day — instead of the next PR finding it (#180). Never on PRs: their checks are
  # the gate there.
  alert:
    name: Alert on red
    runs-on: ubuntu-latest
    needs: [claude-md, fmt, clippy, clippy-canary, test, coverage, audit, deny, sast, miri, miri-canary, mutants]
    if: >-
      always() && github.event_name != 'pull_request' &&
      (contains(needs.*.result, 'failure') ||
       needs.clippy-canary.outputs.outcome == 'failure' ||
       needs.miri-canary.outputs.outcome == 'failure')
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          red=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.outputs.outcome == "failure") | .key' <<<"$NEEDS" | paste -sd, -)
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="CI red on \`$GITHUB_REF_NAME\` ($GITHUB_EVENT_NAME, $GITHUB_SHA): **$red** — $url"
          gh label create ci-red --color B60205 --description "CI is red on master or a canary" 2>/dev/null || true
          n=$(gh issue list --label ci-red --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
          else gh issue create --label ci-red --title "CI red on $GITHUB_REF_NAME: $red" --body "$body"; fi
