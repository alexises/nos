name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
  # `mutants` only: too slow for every push, so it runs on the nightly cron and on
  # manual dispatch; every other job skips the cron (`github.event_name != 'schedule'`).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: make coverage
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/rust --exclude target --error --metrics=off --sarif --output semgrep.sarif .
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

  miri:
    name: Miri (UB check)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      # Nightly deprecates std items stable still accepts (e.g. `AtomicU64::fetch_update`);
      # that lint noise must not gate CI, `-D warnings` on stable already covers the rest.
      RUSTFLAGS: "-D warnings -A deprecated"
      # Tests read the clock and open files/sockets; Miri's sandbox would refuse them.
      MIRIFLAGS: "-Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Only the pure-logic leaf crates: Miri cannot execute FFI, and everything else in
      # the workspace either is FFI (`nos-tcp-auth`/`nos-l2-socket` — raw setsockopt and
      # AF_PACKET), runs TLS through aws-lc-rs's C code in its tests (`nos-pki` and every
      # daemon/client), or is argon2 (`nos-password`), hours long under an interpreter.
      - run: cargo miri test -p nos-rpl -p nos-ospf-common -p nos-proto

  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Run nightly or on manual dispatch only — too slow for every PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      - run: cargo mutants --workspace
