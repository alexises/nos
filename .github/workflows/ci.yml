name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
  # `mutants` only: too slow for every push, so it runs on the nightly cron and on
  # manual dispatch; every other job skips the cron (`github.event_name != 'schedule'`).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The toolchain fmt/clippy/test/coverage run on. Bump it on purpose (see CLAUDE.md
  # "Rust toolchain"); `clippy-canary` warns when the newest stable would break.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  clippy-canary:
    name: Clippy (stable canary)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Step-level continue-on-error keeps the check green: a job-level one still
      # shows a red X on the commit/PR.
      - id: canary
        continue-on-error: true
        run: cargo clippy --workspace --all-targets
      - if: steps.canary.outcome == 'failure'
        run: echo "::warning::The newest stable rustc breaks clippy -D warnings; bump RUST_TOOLCHAIN in ci.yml (see CLAUDE.md \"Rust toolchain\")."

  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: make coverage
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Text output, so findings print in the log like `make sast`. No SARIF upload:
      # code scanning is off on this private repo, so it could never succeed.
      - run: semgrep scan --config p/rust --exclude target --error --metrics=off .

  miri:
    name: Miri (UB check)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      # Nightly deprecations land ahead of stable; that lint noise must not gate CI,
      # `-D warnings` on the pinned toolchain already covers the rest.
      RUSTFLAGS: "-D warnings -A deprecated"
      # Tests read the clock and open files/sockets; Miri's sandbox would refuse them.
      MIRIFLAGS: "-Zmiri-disable-isolation"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Only the pure-logic leaf crates: Miri cannot execute FFI, and everything else in
      # the workspace either is FFI (`nos-tcp-auth`/`nos-l2-socket` — raw setsockopt and
      # AF_PACKET), runs TLS through aws-lc-rs's C code in its tests (`nos-pki` and every
      # daemon/client), or is argon2 (`nos-password`), hours long under an interpreter.
      - run: cargo miri test -p nos-rpl -p nos-ospf-common -p nos-proto

  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Run nightly or on manual dispatch only — too slow for every PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      - run: cargo mutants --workspace
