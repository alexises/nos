[package]
name    = "nos-ospfv3"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nos-pki            = { workspace = true }
nos-daemon         = { workspace = true }
tokio              = { workspace = true, features = ["signal"] }
serde              = { workspace = true }
tracing            = { workspace = true }
thiserror          = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
tracing-subscriber = { workspace = true }
nos-proto          = { workspace = true }
nos-log-client     = { workspace = true }
nos-ospf-common    = { workspace = true }
nos-tcp-auth       = { workspace = true }
nos-l2-socket      = { workspace = true }
tokio-util         = { workspace = true }
futures            = { workspace = true }
socket2            = { workspace = true }
libc               = { workspace = true }
nix                = { workspace = true, features = ["net"] }
ipnet              = { workspace = true }
nos-rpl            = { workspace = true }
sha1               = { workspace = true }
sha2               = { workspace = true }
hmac               = { workspace = true }

[[bin]]
name = "nos-ospfv3d"
path = "src/main.rs"

[dev-dependencies]
nos-pki  = { workspace = true, features = ["testing"] }
tokio    = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
nos-test-support = { workspace = true, features = ["fakes"] }
