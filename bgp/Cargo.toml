[package]
name    = "nos-bgp"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nos-pki            = { workspace = true }
nos-daemon        = { workspace = true }
tokio              = { workspace = true, features = ["signal"] }
serde              = { workspace = true }
tracing            = { workspace = true }
thiserror          = { workspace = true }
bytes              = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
nos-proto          = { workspace = true }
nos-tcp-auth       = { workspace = true }
tokio-util         = { workspace = true }
futures            = { workspace = true }
socket2            = { workspace = true }
ipnet              = { workspace = true }
smallvec           = { workspace = true }
nos-rpl            = { workspace = true }
dhat               = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]

[[bin]]
name = "nos-bgpd"
path = "src/main.rs"

[dev-dependencies]
nos-pki  = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }
nos-test-support = { workspace = true, features = ["fakes"] }
