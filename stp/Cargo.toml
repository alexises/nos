[package]
name    = "nos-stp"
publish = false
version = "0.1.0"
edition = "2021"
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror          = { workspace = true }
nos-pki            = { workspace = true }
tokio              = { workspace = true, features = ["signal"] }
tracing            = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
tracing-subscriber = { workspace = true }
nos-proto          = { workspace = true }
nos-log-client     = { workspace = true }
nos-l2-socket      = { workspace = true }
tokio-util         = { workspace = true }
futures            = { workspace = true }
hmac               = { workspace = true }
md-5               = { workspace = true }

[[bin]]
name = "nos-stpd"
path = "src/main.rs"

[dev-dependencies]
proptest = { workspace = true }
nos-pki  = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["test-util"] }
